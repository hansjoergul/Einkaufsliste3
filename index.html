<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>🛒 Einkauf</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        :root {
            --accent: #34d399;
            --accent2: #6ee7b7;
            --danger: #f87171;
            --warning: #fbbf24;
            --radius: 20px;
            --radius-sm: 14px;
            --radius-xs: 10px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --spring: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        [data-theme="dark"] {
            --bg: #0d1117;
            --bg2: #161b22;
            --bg3: #21262d;
            --bg4: #30363d;
            --text: #e6edf3;
            --text2: #8b949e;
            --text3: #484f58;
            --border: #30363d;
            --card: #161b22;
            --card-hover: #1c2128;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.6);
            --glow: 0 0 20px rgba(52,211,153,0.15);
        }

        [data-theme="light"] {
            --bg: #f0f4f8;
            --bg2: #ffffff;
            --bg3: #f0f4f8;
            --bg4: #e2e8f0;
            --text: #1a202c;
            --text2: #4a5568;
            --text3: #a0aec0;
            --border: #e2e8f0;
            --card: #ffffff;
            --card-hover: #f7fafc;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
            --glow: 0 0 20px rgba(52,211,153,0.1);
        }

        body {
            font-family: 'Sora', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .app {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            max-width: 480px;
            margin: 0 auto;
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }

        /* HEADER */
        .header {
            padding: 16px 20px 12px;
            padding-top: calc(16px + env(safe-area-inset-top));
            background: var(--bg);
            position: relative;
            z-index: 10;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .app-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text);
        }

        .app-title span {
            color: var(--accent);
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            width: 40px; height: 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg2);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 18px;
        }

        .icon-btn:active { transform: scale(0.92); }

        /* SEARCH */
        .search-wrap {
            position: relative;
        }

        .search-icon-el {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            pointer-events: none;
            color: var(--text3);
        }

        .search-input {
            width: 100%;
            padding: 13px 16px 13px 44px;
            background: var(--bg2);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: 'Sora', sans-serif;
            font-size: 15px;
            outline: none;
            transition: var(--transition);
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: var(--glow);
        }

        .search-input::placeholder { color: var(--text3); }

        /* CATEGORY CHIPS */
        .chips-wrap {
            display: flex;
            gap: 8px;
            padding: 12px 20px 0;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .chips-wrap::-webkit-scrollbar { display: none; }

        .chip {
            flex-shrink: 0;
            padding: 7px 14px;
            border-radius: 100px;
            border: 1.5px solid var(--border);
            background: var(--bg2);
            color: var(--text2);
            font-family: 'Sora', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .chip.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #0d1117;
        }

        .chip:active { transform: scale(0.95); }

        /* TABS */
        .tabs {
            display: flex;
            padding: 12px 20px 0;
            gap: 4px;
            background: var(--bg);
        }

        .tab {
            flex: 1;
            padding: 11px 8px;
            border: none;
            background: none;
            color: var(--text3);
            font-family: 'Sora', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border-radius: var(--radius-xs);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .tab .tab-icon { font-size: 20px; }

        .tab.active {
            color: var(--accent);
            background: rgba(52,211,153,0.08);
        }

        .tab:active { transform: scale(0.94); }

        /* CONTENT */
        .content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px 0 100px;
            scrollbar-width: none;
        }

        .content::-webkit-scrollbar { display: none; }

        .view { display: none; }
        .view.active { display: block; animation: fadeUp 0.25s ease; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* SECTION */
        .section { padding: 0 16px; margin-bottom: 8px; }

        .section-header {
            padding: 6px 4px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-icon {
            width: 28px; height: 28px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text3);
        }

        .section-count {
            margin-left: auto;
            background: var(--bg3);
            color: var(--text3);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 100px;
        }

        /* PRODUCT CARD */
        .product-card {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            background: var(--card);
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            transition: var(--transition);
            cursor: pointer;
            border: 1.5px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            border-radius: 3px;
            background: transparent;
            transition: var(--transition);
        }

        .product-card.in-cart {
            border-color: rgba(52,211,153,0.25);
            background: rgba(52,211,153,0.04);
        }

        .product-card.in-cart::before {
            background: var(--accent);
        }

        .product-card.checked {
            opacity: 0.45;
        }

        .product-card:active { transform: scale(0.98); }

        /* ICON BUBBLE */
        .icon-bubble {
            width: 44px; height: 44px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            margin-right: 12px;
            flex-shrink: 0;
            position: relative;
            transition: var(--transition);
        }

        .product-card.checked .icon-bubble {
            filter: grayscale(1);
        }

        /* Category colors */
        .cat-obst { background: rgba(251,146,60,0.15); }
        .cat-vorrat { background: rgba(251,191,36,0.15); }
        .cat-backwaren { background: rgba(217,119,6,0.15); }
        .cat-kuhlung { background: rgba(59,130,246,0.15); }
        .cat-tiefkuhl { background: rgba(99,102,241,0.15); }
        .cat-haushalt { background: rgba(156,163,175,0.15); }
        .cat-getrankke { background: rgba(14,165,233,0.15); }
        .cat-suss { background: rgba(236,72,153,0.15); }

        .product-info { flex: 1; min-width: 0; }

        .product-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-card.checked .product-name {
            text-decoration: line-through;
            color: var(--text3);
        }

        .product-sub {
            font-size: 11px;
            color: var(--text3);
            margin-top: 1px;
            font-weight: 400;
        }

        /* QUANTITY CONTROL */
        .qty-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .qty-btn {
            width: 30px; height: 30px;
            border-radius: 9px;
            border: 1.5px solid var(--border);
            background: var(--bg3);
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            transition: var(--spring);
            flex-shrink: 0;
        }

        .qty-btn.plus { border-color: var(--accent); background: rgba(52,211,153,0.1); color: var(--accent); }
        .qty-btn:active { transform: scale(0.85); }
        .qty-btn:disabled { opacity: 0.3; cursor: default; }

        .qty-val {
            min-width: 22px;
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }

        .qty-val.nonzero { color: var(--accent); }

        /* CHECKBOX */
        .check-box {
            width: 26px; height: 26px;
            border-radius: 8px;
            border: 2px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            transition: var(--spring);
            cursor: pointer;
            flex-shrink: 0;
            font-size: 14px;
        }

        .check-box.done {
            background: var(--accent);
            border-color: var(--accent);
            animation: checkPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes checkPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        /* STATS BAR */
        .stats-bar {
            margin: 4px 16px 16px;
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 16px;
            border: 1.5px solid var(--border);
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .stat {
            text-align: center;
        }

        .stat-val {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent);
            display: block;
        }

        .stat-lbl {
            font-size: 10px;
            font-weight: 600;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .progress-track {
            height: 6px;
            background: var(--bg3);
            border-radius: 100px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius: 100px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* EMPTY STATE */
        .empty {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-emoji { font-size: 56px; margin-bottom: 16px; opacity: 0.4; }
        .empty-text { font-size: 16px; font-weight: 600; color: var(--text3); }
        .empty-sub { font-size: 13px; color: var(--text3); margin-top: 4px; opacity: 0.6; }

        /* FLOATING ACTIONS */
        .fabs {
            position: fixed;
            bottom: 20px;
            bottom: calc(20px + env(safe-area-inset-bottom));
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 50;
        }

        .fab {
            width: 50px; height: 50px;
            border-radius: 16px;
            border: none;
            color: white;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: var(--spring);
            font-size: 20px;
            box-shadow: var(--shadow-lg);
        }

        .fab:active { transform: scale(0.9); }
        .fab-pdf { background: linear-gradient(135deg, #6366f1, #4f46e5); }
        .fab-clear { background: linear-gradient(135deg, var(--danger), #dc2626); }

        /* MODAL */
        .modal-bg {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: flex-end;
            justify-content: center;
            padding: 0 0 env(safe-area-inset-bottom);
        }

        .modal-bg.open { display: flex; animation: fadeIn 0.2s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal {
            background: var(--bg2);
            border-radius: 24px 24px 0 0;
            padding: 28px 24px 32px;
            width: 100%;
            max-width: 480px;
            animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-handle {
            width: 36px; height: 4px;
            background: var(--border);
            border-radius: 100px;
            margin: -12px auto 20px;
        }

        .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
        .modal-text { color: var(--text2); font-size: 14px; margin-bottom: 24px; }

        .modal-btns { display: flex; gap: 10px; }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Sora', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn:active { transform: scale(0.96); }
        .btn-cancel { background: var(--bg3); color: var(--text2); }
        .btn-danger { background: var(--danger); color: white; }

        /* TOAST */
        .toast {
            position: fixed;
            top: 20px;
            top: calc(20px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: var(--bg2);
            border: 1.5px solid var(--border);
            color: var(--text);
            padding: 12px 20px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
            z-index: 200;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
            box-shadow: var(--shadow-lg);
        }

        .toast.show { transform: translateX(-50%) translateY(0); }

        /* BADGE */
        .cart-badge {
            position: absolute;
            top: -4px; right: -4px;
            background: var(--accent);
            color: #0d1117;
            font-size: 9px;
            font-weight: 800;
            width: 16px; height: 16px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>

<div class="app">

    <div class="header">

                <div class="icon-btn" id="themeBtn" title="Theme wechseln">🌙</div>
                <div class="icon-btn" style="position:relative" id="cartIconBtn">

        </div>

        <button class="tab active" data-view="products">

    <!-- CATEGORY CHIPS (only on products view) -->
    <div class="chips-wrap" id="chipsWrap">
        <button class="chip active" data-cat="">Alle</button>
    </div>

    <!-- CONTENT -->
    <div class="content">
        <div class="view active" id="products-view">
            <div class="section"><div id="products-list"></div></div>
        </div>

        <div class="view" id="categories-view">
            <div id="categories-list"></div>
        </div>

        <div class="view" id="shopping-view">
            <div class="stats-bar">
                <div class="stats-row">
                    <div class="stat">
                        <span class="stat-val" id="statTotal">0</span>
                        <span class="stat-lbl">Artikel</span>

                <div class="progress-track">

                </div>
            </div>
            <div class="section"><div id="shopping-list"></div></div>
        </div>
    </div>

    <!-- FABs -->
    <div class="fabs">
        <button class="fab fab-pdf" id="pdfBtn" title="PDF Export">📄</button>
        <button class="fab fab-clear" id="clearBtn" title="Liste leeren">🗑️</button>
    </div>

</div>

<!-- CLEAR MODAL -->
<div class="modal-bg" id="clearModal">
    <div class="modal">
        <div class="modal-handle"></div>
        <div class="modal-title">Liste leeren?</div>
        <div class="modal-text">Alle Artikel werden aus der Einkaufsliste entfernt. Diese Aktion kann nicht rückgängig gemacht werden.</div>
        <div class="modal-btns">
            <button class="btn btn-cancel" id="cancelClear">Abbrechen</button>
            <button class="btn btn-danger" id="confirmClear">Leeren</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

    { name: "Müsliriegel", category: "Süßigkeiten", icon: "🍫" },

const CAT_STYLES = {
    "Obst & Gemüse":  { cls: "cat-obst",     icon: "🌿" },
    "Vorratsschrank": { cls: "cat-vorrat",    icon: "🏺" },
    "Backwaren":      { cls: "cat-backwaren", icon: "🥐" },
    "Kühlung":        { cls: "cat-kuhlung",   icon: "🧊" },
    "Tiefkühl":       { cls: "cat-tiefkuhl",  icon: "❄️" },
    "Haushalt":       { cls: "cat-haushalt",  icon: "🏠" },
    "Getränke":       { cls: "cat-getrankke", icon: "🥤" },
    "Süßigkeiten":    { cls: "cat-suss",      icon: "🍬" },
};

// ── STATE ──────────────────────────────────────────────
let cart = {};
let searchTerm = '';
let activeView = 'products';
let activeCat = '';
let isDark = true;

// ── FIREBASE ───────────────────────────────────────────
const cartRef = ref(db, 'shoppingCart');
onValue(cartRef, snap => {
    cart = snap.val() || {};
    render();
    updateStats();
    updateBadge();
});

function saveCart() {
    set(cartRef, Object.keys(cart).length ? cart : null);
}

// ── RENDER HELPERS ─────────────────────────────────────
function catCls(category) {
    return CAT_STYLES[category]?.cls || 'cat-vorrat';
}

function catIcon(category) {
    return CAT_STYLES[category]?.icon || '📦';
}

function productCard(product, showCheck = false) {
    const item = cart[product.name];
    const qty = item?.qty || 0;
    const checked = item?.checked || false;
    const inCart = qty > 0;

    return `
    <div class="product-card ${inCart ? 'in-cart' : ''} ${checked ? 'checked' : ''}" data-name="${product.name}">
        <div class="icon-bubble ${catCls(product.category)}">${product.icon}</div>
        <div class="product-info">
            <div class="product-name">${product.name}</div>
            <div class="product-sub">${product.category}</div>
        </div>
        ${showCheck ? `
            <div class="check-box ${checked ? 'done' : ''}" data-check="${product.name}">
                ${checked ? '✓' : ''}
            </div>
        ` : `
            <div class="qty-wrap">
                <button class="qty-btn minus" data-name="${product.name}" ${qty === 0 ? 'disabled' : ''}>−</button>
                <span class="qty-val ${qty > 0 ? 'nonzero' : ''}">${qty}</span>
                <button class="qty-btn plus" data-name="${product.name}">+</button>
            </div>
        `}
    </div>`;
}

function filtered() {
    let list = CATALOG;
    if (searchTerm) list = list.filter(p =>
        p.name.toLowerCase().includes(searchTerm) ||
        p.category.toLowerCase().includes(searchTerm)
    );
    if (activeCat) list = list.filter(p => p.category === activeCat);
    return list;
}

// ── RENDER VIEWS ───────────────────────────────────────
function renderProducts() {
    const list = filtered();
    const el = document.getElementById('products-list');
    if (!list.length) {
        el.innerHTML = `<div class="empty"><div class="empty-emoji">🔍</div><div class="empty-text">Nichts gefunden</div><div class="empty-sub">Probiere einen anderen Suchbegriff</div></div>`;
        return;
    }
    el.innerHTML = list.map(p => productCard(p)).join('');
}

function renderCategories() {
    const list = filtered();
    const groups = {};
    list.forEach(p => { (groups[p.category] = groups[p.category] || []).push(p); });
    const el = document.getElementById('categories-list');
    if (!Object.keys(groups).length) {
        el.innerHTML = `<div class="empty"><div class="empty-emoji">📦</div><div class="empty-text">Keine Kategorien</div></div>`;
        return;
    }
    el.innerHTML = Object.entries(groups).map(([cat, prods]) => `
        <div class="section">
            <div class="section-header">
                <div class="section-icon ${catCls(cat)}">${catIcon(cat)}</div>
                <div class="section-title">${cat}</div>
                <div class="section-count">${prods.length}</div>
            </div>
            ${prods.map(p => productCard(p)).join('')}
        </div>
    `).join('');
}

function renderShopping() {
    const items = CATALOG
        .filter(p => cart[p.name]?.qty > 0)
        .map(p => ({ ...p, ...cart[p.name] }));

    const el = document.getElementById('shopping-list');
    if (!items.length) {
        el.innerHTML = `<div class="empty"><div class="empty-emoji">🛒</div><div class="empty-text">Liste ist leer</div><div class="empty-sub">Füge Produkte im Tab "Produkte" hinzu</div></div>`;
        return;
    }

    // Group by category in shopping view
    const groups = {};
    items.forEach(p => { (groups[p.category] = groups[p.category] || []).push(p); });
    el.innerHTML = Object.entries(groups).map(([cat, prods]) => `
        <div class="section">
            <div class="section-header">
                <div class="section-icon ${catCls(cat)}">${catIcon(cat)}</div>
                <div class="section-title">${cat}</div>
                <div class="section-count">${prods.length}</div>
            </div>
            ${prods.map(p => productCard(p, true)).join('')}
        </div>
    `).join('');
}

function render() {
    renderProducts();
    renderCategories();
    renderShopping();
    bindEvents();
}

function bindEvents() {
    // Qty buttons
    document.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', e => {
            e.stopPropagation();
            const name = btn.dataset.name;
            const cur = cart[name]?.qty || 0;
            if (btn.classList.contains('plus')) {
                updateItem(name, cur + 1);
            } else if (cur > 0) {
                updateItem(name, cur - 1);
            }
        });
    });

    // Checkboxes
    document.querySelectorAll('[data-check]').forEach(el => {
        el.addEventListener('click', e => {
            e.stopPropagation();
            const name = el.dataset.check;
            if (cart[name]) {
                cart[name].checked = !cart[name].checked;
                render();
                updateStats();
                saveCart();
            }
        });
    });
}

function updateItem(name, qty) {
    if (qty > 0) {
        cart[name] = { qty, checked: cart[name]?.checked || false };
    } else {
        delete cart[name];
    }
    render();
    updateStats();
    updateBadge();
    saveCart();
}

function updateStats() {
    const items = Object.values(cart);
    const total = items.length;
    const done = items.filter(i => i.checked).length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statDone').textContent = done;
    document.getElementById('statPct').textContent = `${pct}%`;
    document.getElementById('progressFill').style.width = `${pct}%`;
}

function updateBadge() {
    const n = Object.keys(cart).length;
    const badge = document.getElementById('cartBadge');
    if (n > 0) {
        badge.style.display = 'flex';
        badge.textContent = n > 99 ? '99+' : n;
    } else {
        badge.style.display = 'none';
    }
}

// ── CHIPS ──────────────────────────────────────────────
function buildChips() {
    const cats = [...new Set(CATALOG.map(p => p.category))];
    const wrap = document.getElementById('chipsWrap');
    wrap.innerHTML = `<button class="chip active" data-cat="">Alle</button>` +
        cats.map(c => `<button class="chip" data-cat="${c}">${catIcon(c)} ${c}</button>`).join('');

    wrap.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
            activeCat = chip.dataset.cat;
            wrap.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            render();
        });
    });
}

// ── TABS ───────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        activeView = tab.dataset.view;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(`${activeView}-view`).classList.add('active');

        // Show/hide chips only on products view
        document.getElementById('chipsWrap').style.display =
            activeView === 'products' ? 'flex' : 'none';
    });
});

// ── SEARCH ─────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', e => {
    searchTerm = e.target.value.toLowerCase().trim();
    render();
});

// ── THEME ──────────────────────────────────────────────
document.getElementById('themeBtn').addEventListener('click', () => {
    isDark = !isDark;
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
});

// ── CLEAR MODAL ────────────────────────────────────────
document.getElementById('clearBtn').addEventListener('click', () => {
    document.getElementById('clearModal').classList.add('open');
});
document.getElementById('cancelClear').addEventListener('click', () => {
    document.getElementById('clearModal').classList.remove('open');
});
document.getElementById('confirmClear').addEventListener('click', () => {
    cart = {};
    render(); updateStats(); updateBadge();
    remove(cartRef);
    document.getElementById('clearModal').classList.remove('open');
    showToast('🗑️ Liste geleert');
});

// Close modal on backdrop click
document.getElementById('clearModal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('open');
});

// ── CART BADGE → switch to shopping ────────────────────
document.getElementById('cartIconBtn').addEventListener('click', () => {
    document.querySelector('[data-view="shopping"]').click();
});

// ── PDF EXPORT ─────────────────────────────────────────
document.getElementById('pdfBtn').addEventListener('click', () => {
    const items = CATALOG.filter(p => cart[p.name]?.qty > 0).map(p => ({ ...p, ...cart[p.name] }));
    if (!items.length) { showToast('⚠️ Liste ist leer!'); return; }

    const lines = [`EINKAUFSLISTE`, `Stand: ${new Date().toLocaleDateString('de-AT')}`, ``, `─────────────────────────────`];
    const groups = {};
    items.forEach(p => { (groups[p.category] = groups[p.category] || []).push(p); });
    Object.entries(groups).forEach(([cat, prods]) => {
        lines.push(``, `▸ ${cat.toUpperCase()}`, ``);
        prods.forEach(p => {
            const status = p.checked ? '✓' : '○';
            lines.push(`  ${status}  ${p.name}  (${p.qty}×)`);
        });
    });
    lines.push(``, `─────────────────────────────`);
    lines.push(`Gesamt: ${items.length} Artikel | Erledigt: ${items.filter(i=>i.checked).length}`);

    const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Einkaufsliste_${new Date().toISOString().slice(0,10)}.txt`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('📄 Export erfolgreich!');
});

// ── TOAST ──────────────────────────────────────────────
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

// ── INIT ───────────────────────────────────────────────
buildChips();
render();
